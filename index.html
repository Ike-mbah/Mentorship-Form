<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentorship Application Form</title>
  </head>
  <body>
    <h1>Mentorship Application Form</h1>
    <p>
      Please fill out the form below to apply for our upcoming tech mentorship
      cohort.
    </p>

    <form action="/submit-application" method="post">
      <!-- Fieldset 1: Personal Information -->
      <fieldset>
        <legend>Personal Information</legend>

        <div>
          <label for="fullname">Full Name:</label> <br />
          <input
            type="text"
            id="fullname"
            name="fullname"
            required
            minlength="2"
            maxlength="100"
            placeholder="e.g., Ada Lovelace" />
        </div>

        <br />

        <div>
          <label for="email">Email Address:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="ada@example.com" />
        </div>

        <br />

        <div>
          <label for="phone">Phone Number:</label><br />
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            placeholder="123-456-7890" />
        </div>
        <br />

        <div>
          <label for="dob">Date of Birth:</label><br />
          <input type="date" id="dob" name="dob" required max="2010-12-31" />
        </div>
        <br />

        <div>
          <label>Gender:</label><br />
          <input type="radio" id="gender-female" name="gender" value="female" />
          <label for="gender-female">Female</label><br />

          <input type="radio" id="gender-male" name="gender" value="male" />
          <label for="gender-male">Male</label><br />

          <input type="radio" id="gender-other" name="gender" value="other" />
          <label for="gender-other">Other / Prefer not to say</label>
        </div>
      </fieldset>

      <br />

      <!-- Fieldset 2: Development Information -->
      <fieldset>
        <legend>Development Information</legend>

        <div>
          <label for="experience">Current Experience Level:</label><br />
          <select id="experience" name="experience" required>
            <option value="">--Please choose an option--</option>
            <option value="beginner">Beginner (0-1 years)</option>
            <option value="intermediate">Intermediate (1-3 years)</option>
            <option value="advanced">Advanced (3+ years)</option>
          </select>
        </div>
        <br />

        <div>
          <label>Areas of Interest (Select all that apply):</label><br />
          <input
            type="checkbox"
            id="interest-frontend"
            name="interests"
            value="frontend" />
          <label for="interest-frontend">Frontend Development</label><br />

          <input
            type="checkbox"
            id="interest-backend"
            name="interests"
            value="backend" />
          <label for="interest-backend">Backend Development</label><br />

          <input
            type="checkbox"
            id="interest-uiux"
            name="interests"
            value="uiux" />
          <label for="interest-uiux">UI/UX Design</label>
        </div>
        <br />

        <div>
          <label for="track">Preferred Learning Track:</label><br />
          <select id="track" name="track" required>
            <option value="">--Select a track--</option>
            <option value="web-dev">Full-Stack Web Development</option>
            <option value="mobile-dev">Mobile App Development</option>
            <option value="data-science">Data Science & AI</option>
          </select>
        </div>
        <br />

        <div>
          <label for="github">GitHub Profile URL:</label><br />
          <input
            type="url"
            id="github"
            name="github"
            placeholder="https://github.com/username" />
        </div>
        <br />

        <div>
          <label for="statement">Why do you want to join this mentorship?</label
          ><br />
          <textarea
            id="statement"
            name="statement"
            rows="5"
            cols="40"
            required
            minlength="20"
            placeholder="Tell us about your goals..."></textarea>
        </div>
      </fieldset>
      <br />
      <!-- Fieldset 3: Other Preferences & Agreement -->
      <fieldset>
        <legend>Availability & Agreement</legend>

        <div>
          <label for="availability">Weekly Availability:</label><br />
          <select id="availability" name="availability" required>
            <option value="">--Select hours per week--</option>
            <option value="5-10">5 - 10 hours</option>
            <option value="10-20">10 - 20 hours</option>
            <option value="20+">20+ hours</option>
          </select>
        </div>
        <br />

        <div>
          <input type="checkbox" id="rules" name="rules" required />
          <label for="rules"
            >I agree to abide by the mentorship code of conduct and
            rules.</label
          >
        </div>
      </fieldset>

      <br />

      <!-- Submit Button -->
      <button type="submit">Submit Application</button>
    </form>
  </body>
</html>
